<!doctype html><html lang="pt-AO"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WetoSoft — Administração</title><style>body{font-family:system-ui,sans-serif;max-width:1050px;margin:30px auto;padding:0 18px}input,select,button{padding:9px;margin:4px 0}section{border:1px solid #ddd;border-radius:10px;padding:16px;margin:14px 0}pre{white-space:pre-wrap;background:#f5f5f5;padding:10px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}.hidden{display:none}</style></head><body>
<h1>WetoSoft — Administração</h1><p>Gestão central de empresas e licenças.</p>
<section id="login"><h2>Acesso</h2><input id="user" autocomplete="username" placeholder="Utilizador"><input id="pass" type="password" autocomplete="current-password" placeholder="Palavra-passe"><button id="loginBtn">Entrar</button><pre id="loginOut"></pre></section>
<div id="app" class="hidden">
<section><button id="logout">Sair</button> <span id="who"></span></section>
<section><h2>Nova empresa</h2><div class="grid"><input id="legal" placeholder="Nome legal"><input id="email" type="email" placeholder="Email"><input id="nif" placeholder="NIF"></div><button id="tenantBtn">Criar empresa</button><pre id="tenantOut"></pre></section>
<section><h2>Gerar ativação</h2><div class="grid"><input id="tenantId" placeholder="Tenant ID"><select id="plan"><option>QUARTERLY</option><option>SEMIANNUAL</option><option selected>ANNUAL</option></select></div><button id="codeBtn">Gerar código</button><pre id="codeOut"></pre></section>
<section><h2>Licenças</h2><button id="refreshBtn">Atualizar</button><pre id="licenses"></pre></section>
<section><h2>Revogar</h2><input id="licenseId" placeholder="License ID"><button id="revokeBtn">Revogar</button><pre id="revokeOut"></pre></section>
</div><script>
let authenticated=false;
const req=async(path,opt={})=>{const h={'content-type':'application/json'};const r=await fetch('/api/v1/'+path,{...opt,headers:h});let b={};try{b=await r.json()}catch{};if(r.status===401){authenticated=false;show(false)}return {status:r.status,body:b}};
const show=on=>{document.querySelector('#login').classList.toggle('hidden',on);document.querySelector('#app').classList.toggle('hidden',!on)};
async function login(){const r=await req('auth/login',{method:'POST',body:JSON.stringify({username:document.querySelector('#user').value,password:document.querySelector('#pass').value})});if(r.status===200){authenticated=true;document.querySelector('#who').textContent=r.body.user.username+' — '+r.body.user.role;show(true);load()}else document.querySelector('#loginOut').textContent=JSON.stringify(r.body,null,2)}
async function load(){const r=await req('admin/licenses');document.querySelector('#licenses').textContent=JSON.stringify(r.body,null,2)}
document.querySelector('#loginBtn').onclick=login;document.querySelector('#logout').onclick=async()=>{await req('auth/logout',{method:'POST'});authenticated=false;show(false)};document.querySelector('#tenantBtn').onclick=async()=>{const r=await req('admin/tenant',{method:'POST',body:JSON.stringify({legalName:legal.value,email:email.value,nif:nif.value})});tenantOut.textContent=JSON.stringify(r.body,null,2);if(r.body.id)tenantId.value=r.body.id};document.querySelector('#codeBtn').onclick=async()=>{const r=await req('admin/activation-code',{method:'POST',body:JSON.stringify({tenantId:tenantId.value,planCode:plan.value})});codeOut.textContent=JSON.stringify(r.body,null,2)};document.querySelector('#refreshBtn').onclick=load;document.querySelector('#revokeBtn').onclick=async()=>{const r=await req('admin/license/revoke',{method:'POST',body:JSON.stringify({licenseId:licenseId.value})});revokeOut.textContent=JSON.stringify(r.body,null,2);load()};
show(false);
</script></body></html>
